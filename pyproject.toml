[project]
name = "jurisflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.142.2",
    "fastembed>=0.8.1",
    "filelock>=4.0.7",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "tokenizers>=0.22,<=0.23.0",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.51,<5",
    "peft>=0.15,<1",
    "accelerate>=1.6,<2",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
