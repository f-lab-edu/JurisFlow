name: "🚀 Deploy"
description: "서비스 배포 및 배포 환경 설정"
labels: ["deploy"]
body:
  - type: textarea
    id: description
    attributes:
      label: "📄 배포 설명"
      description: 배포 목적과 포함되는 변경 사항을 작성해 주세요.
      placeholder: 배포할 기능, 수정 사항 및 영향 범위를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "🌐 배포 대상"
      description: 배포 환경과 대상 버전 또는 브랜치를 작성해 주세요.
      placeholder: |
        배포 환경 (개발 / 스테이징 / 운영):
        대상 버전 또는 브랜치:
        배포 예정 일시:
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업할 내용"
      description: 배포 준비부터 배포 후 확인까지 할 일을 체크박스 형태로 작성해 주세요.
      placeholder: |
        - [ ] 환경 변수 및 설정 확인
        - [ ] 빌드 및 테스트 확인
        - [ ] 배포 진행
        - [ ] 배포 후 주요 기능 및 로그 확인
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: "⏪ 롤백 계획"
      description: 배포 실패 시 복구 방법을 작성해 주세요. 해당하지 않으면 이유를 적어 주세요.
      placeholder: 롤백 판단 기준, 복구할 버전 및 복구 절차를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "🙋🏻 참고 자료"
      description: 배포 문서, 관련 PR 또는 참고 링크가 있다면 작성해 주세요.
